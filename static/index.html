<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dasho Claim Check</title>
<style>
:root{font:17px/1.5 system-ui,sans-serif;color:#172027;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:24px 18px}h1{font-size:2rem;line-height:1.15;margin:8px 0}.sub{color:#53645d;margin:0 0 22px}form,.card{background:white;border:1px solid #dce5df;border-radius:14px;padding:18px;margin:14px 0}label{display:block;font-weight:650;margin:14px 0 6px}textarea,select,input{font:inherit;width:100%;padding:11px;border:1px solid #bac9c0;border-radius:8px}button{font:inherit;font-weight:650;border:0;border-radius:8px;padding:11px 16px;background:#167653;color:white;margin:12px 8px 0 0;cursor:pointer}.secondary{background:#e4eee8;color:#173c2d}.trace{font-family:ui-monospace,monospace;font-size:14px;max-height:220px;overflow:auto;background:#172027;color:#d5f6e4;padding:12px;border-radius:8px}article{border-top:1px solid #e4ebe6;padding:12px 0}.hidden{display:none}@media(max-width:430px){main{padding:18px 13px}h1{font-size:1.7rem}form,.card{padding:14px}}
</style><main><h1>Dasho Claim Check</h1><p class="sub">Check creator videos against your source pack before they go live.</p>
<form id="form"><label>Creator video (15–90 seconds)</label><input type="file" name="video" accept="video/*" required><label>Product pack</label><select name="pack"><option>Tech claims</option><option>FDA beauty</option></select><label>Source pack — paste product docs or URLs</label><textarea name="sources" rows="5">Ledgerly AI helps teams organize invoices and flag unusual charges for human review. It does not guarantee fraud prevention or regulatory compliance.</textarea><label>Key messages, one per line</label><textarea name="key_messages" rows="3">Organize invoices
Flag unusual charges</textarea><button>Review video</button></form>
<section id="results" class="hidden"><section class="card"><h2>Agent trace</h2><div id="trace" class="trace" aria-live="polite"></div></section><section class="card"><h2>Review</h2><p id="summary"></p><div id="claims"></div><label>Named reviewer</label><input id="reviewer" placeholder="Name"><button onclick="decide('approved')">Approve</button><button class="secondary" onclick="decide('changes requested')">Request changes</button><p id="decision"></p></section></section>
<script>let reviewId;const form=document.querySelector('#form');form.onsubmit=async e=>{e.preventDefault();const out=document.querySelector('#results'),trace=document.querySelector('#trace');out.classList.remove('hidden');trace.textContent='Reviewing…';const r=await fetch('/api/review',{method:'POST',body:new FormData(form)});const x=await r.json();reviewId=x.id;trace.textContent=x.trace.map(s=>`${s.step}. ${s.tool}: ${JSON.stringify(s.output)}`).join('\n');document.querySelector('#summary').textContent=`Disclosure ${x.disclosure?'found':'missing'} · ${x.coverage.missing.length} key message(s) missing`;document.querySelector('#claims').innerHTML=x.claims.map(c=>`<article><strong>${c.timestamp}s · ${c.verdict.toUpperCase()}</strong><p>Creator: “${escapeHtml(c.quote)}”</p><p>Evidence: ${escapeHtml(c.evidence)}</p>${c.suggested_line?`<p>Suggested: ${escapeHtml(c.suggested_line)}</p>`:''}<p>Rounds: ${c.rounds.length}</p></article>`).join('')||'<p>No high-risk factual claims detected.</p>'};function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function decide(status){const r=await fetch(`/api/review/${reviewId}/decision`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reviewer:document.querySelector('#reviewer').value})});document.querySelector('#decision').textContent=`${(await r.json()).status} recorded locally.`}</script></main></html>
