<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dasho Claim Check</title>
<style>
:root{font:17px/1.5 system-ui,sans-serif;color:#172027;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:24px 18px}h1{font-size:2rem;line-height:1.15;margin:8px 0}.sub{color:#53645d;margin:0 0 22px}form,.card{background:white;border:1px solid #dce5df;border-radius:14px;padding:18px;margin:14px 0}label{display:block;font-weight:650;margin:14px 0 6px}textarea,select,input{font:inherit;width:100%;padding:11px;border:1px solid #bac9c0;border-radius:8px}button{font:inherit;font-weight:650;border:0;border-radius:8px;padding:11px 16px;background:#167653;color:white;margin:12px 8px 0 0;cursor:pointer}.secondary{background:#e4eee8;color:#173c2d}.trace{font-family:ui-monospace,monospace;font-size:14px;max-height:220px;overflow:auto;background:#172027;color:#d5f6e4;padding:12px;border-radius:8px;white-space:pre-wrap}.badge{display:inline-block;background:#e4eee8;color:#173c2d;border-radius:20px;padding:4px 10px;font-size:14px}article{border-top:1px solid #e4ebe6;padding:12px 0}.hidden{display:none}.status{font-weight:700}.covered{color:#167653}.partly{color:#9a6500}.missing,.fail{color:#ae3333}@media(max-width:430px){main{padding:18px 13px}h1{font-size:1.7rem}form,.card{padding:14px}}
</style><main><h1>Dasho Claim Check</h1><p class="sub">Check creator videos against your source pack before they go live.</p>
<form id="form"><label>Creator video (15–90 seconds)</label><input type="file" name="video" accept="video/*" required><label>Product pack</label><select name="pack"><option>Tech claims</option><option>FDA beauty</option></select><label>Source pack — paste product docs or URLs</label><textarea name="sources" rows="5">Ledgerly AI helps teams organize invoices and flag unusual charges for human review. It does not guarantee fraud prevention or regulatory compliance.</textarea><label>Key messages, one per line</label><textarea name="key_messages" rows="3">Organize invoices
Flag unusual charges</textarea><button>Review video</button></form>
<section id="results" class="hidden"><section class="card"><h2>Agent trace</h2><p id="provider" class="badge"></p><div id="trace" class="trace" aria-live="polite"></div></section><section class="card"><h2>Review</h2><p id="summary"></p><div id="disclosure"></div><h3>Key message coverage</h3><div id="coverage"></div><h3>Product claims</h3><div id="claims"></div><label for="reviewer">Named reviewer</label><input id="reviewer" placeholder="Name" required><button onclick="decide('approved')">Approve</button><button class="secondary" onclick="decide('changes requested')">Request changes</button><p id="decision"></p></section></section>
<script>
let reviewId,eventSource;const form=document.querySelector('#form');
form.onsubmit=async e=>{e.preventDefault();const out=document.querySelector('#results'),trace=document.querySelector('#trace');out.classList.remove('hidden');trace.textContent='Reviewing…';const r=await fetch('/api/review',{method:'POST',body:new FormData(form)});const x=await r.json();reviewId=x.id;
 document.querySelector('#provider').textContent=x.provider==='meta'?'Meta cloud · Muse Spark':x.provider==='local'?'Muse Spark Open local':'Offline demo provider';
 trace.textContent='';if(eventSource)eventSource.close();eventSource=new EventSource(`/api/review/${reviewId}/events`);eventSource.onmessage=event=>{const s=JSON.parse(event.data);trace.textContent+=`${s.step}. ${s.tool}: ${JSON.stringify(s.output)}\n`;trace.scrollTop=trace.scrollHeight};eventSource.onerror=()=>eventSource.close();
 const d=x.disclosure;document.querySelector('#summary').textContent=`Disclosure ${d.disclosed?'found':'missing'}${d.timestamp===null?'':` · ${d.timestamp}s`} · ${x.coverage.messages.filter(m=>m.status==='missing').length} key message(s) missing`;
 document.querySelector('#disclosure').innerHTML=`<p><strong>Paid partnership disclosure:</strong> <span class="status ${d.disclosed?'covered':'missing'}">${d.disclosed?'Found':'Missing'}</span> · ${escapeHtml(d.how)}${d.timestamp===null?'':` at ${d.timestamp}s`}</p>`;
 document.querySelector('#coverage').innerHTML=x.coverage.messages.map(m=>`<article><strong class="status ${m.status}">${escapeHtml(m.status.toUpperCase())}</strong><p>${escapeHtml(m.message)}</p>${m.quote?`<p>Quote: “${escapeHtml(m.quote)}”</p>`:''}</article>`).join('')||'<p>No key messages provided.</p>';
 document.querySelector('#claims').innerHTML=x.claims.map(c=>`<article><strong>${c.start??c.timestamp}s · <span class="status ${c.verdict}">${escapeHtml(c.verdict.toUpperCase())}</span></strong><p>Creator: “${escapeHtml(c.quote)}”</p><p>Evidence: ${escapeHtml(c.evidence)}</p>${c.suggested_line?`<p>Suggested line: ${escapeHtml(c.suggested_line)}</p>`:''}<p>Rounds: ${c.rounds.length}</p></article>`).join('')||'<p>No high-risk factual claims detected.</p>'};
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function decide(status){const reviewer=document.querySelector('#reviewer').value.trim();if(!reviewer){document.querySelector('#reviewer').focus();return}const r=await fetch(`/api/review/${reviewId}/decision`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reviewer})});document.querySelector('#decision').textContent=`${(await r.json()).status} recorded locally.`}
</script></main></html>
